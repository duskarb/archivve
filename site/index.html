<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID20012: Design Studio 1 Archive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <nav class="site-menu" aria-label="Archive sections">
      <a href="index.html" aria-current="page">Archive</a>
      <a href="index.json">Data</a>
      <a href="replay/README.md">Replay</a>
    </nav>

    <header class="masthead">
      <div>
        <p class="kicker">ID20012 / KAIST Industrial Design / Spring 2026</p>
        <h1 aria-label="Design Studio 1 Archive">
          <span>Design</span>
          <span>Studio 1</span>
          <span>Archive</span>
        </h1>
        <p class="course-subtitle">Exploring Aesthetics and Form Giving</p>
      </div>
      <div class="summary" aria-live="polite">
        <span id="item-count">0 works</span>
        <span id="semester-count">0 semesters</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Archive filters">
      <label class="field">
        <span>Search:</span>
        <input id="search" type="search" autocomplete="off">
      </label>
      <label class="field">
        <span>Semester:</span>
        <select id="semester">
          <option value="">All</option>
        </select>
      </label>
      <label class="field">
        <span>Status:</span>
        <select id="status">
          <option value="">All</option>
        </select>
      </label>
    </section>

    <section class="archive-list" aria-label="Archived works">
      <div class="list-head" aria-hidden="true">
        <span>No.</span>
        <span>Work</span>
        <span>Student</span>
        <span>Semester</span>
        <span>Status</span>
      </div>
      <div id="archive-list"></div>
      <p class="empty" id="empty-state">No archived works yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
