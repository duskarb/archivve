<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archived Work</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-body">
  <header class="viewer-bar">
    <a href="index.html">Archive</a>
    <div>
      <strong id="viewer-title">Archived Work</strong>
      <span id="viewer-meta"></span>
    </div>
    <a id="viewer-original" href="#" target="_blank" rel="noopener">Original</a>
  </header>
  <main class="viewer-frame" id="viewer-frame"></main>

  <script>
    const params = new URLSearchParams(location.search);
    const source = params.get("source") || "";
    const url = params.get("url") || "";
    const title = params.get("title") || "Archived Work";
    const student = params.get("student") || "";

    document.title = title;
    document.getElementById("viewer-title").textContent = title;
    document.getElementById("viewer-meta").textContent = student;
    const originalLink = document.getElementById("viewer-original");
    if (url) {
      originalLink.href = url;
    } else {
      originalLink.hidden = true;
    }

    function showMessage(message) {
      const frame = document.getElementById("viewer-frame");
      frame.innerHTML = "";
      const box = document.createElement("section");
      box.className = "viewer-message";
      box.textContent = message;
      frame.appendChild(box);
    }

    if (!source || !url) {
      showMessage("Archive source is missing. Capture this row first, then return here.");
    } else {
      const replayScript = document.createElement("script");
      replayScript.src = "replay/ui.js";
      replayScript.onload = () => {
        const replay = document.createElement("replay-web-page");
        replay.setAttribute("replayBase", "replay/");
        replay.setAttribute("source", source);
        replay.setAttribute("url", url);
        document.getElementById("viewer-frame").appendChild(replay);
      };
      replayScript.onerror = () => {
        showMessage("Replay runtime is not installed in site/replay/.");
      };
      document.body.appendChild(replayScript);
    }
  </script>
</body>
</html>
