<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Web Archive</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #111111;
      --soft-line: #dddddd;
      --mark: #f4e850;
      --font: Arial, "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.35;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 14px 0 56px;
    }

    .topbar,
    .masthead,
    .toolbar,
    .list-head,
    .archive-row {
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      text-transform: uppercase;
    }

    .topbar a {
      text-decoration: none;
    }

    .topbar a:hover {
      background: var(--mark);
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 20px;
      padding: 16px 0 18px;
    }

    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .subtitle,
    .summary,
    .status {
      color: var(--muted);
    }

    .subtitle {
      margin: 12px 0 0;
      max-width: 620px;
    }

    .summary {
      display: grid;
      gap: 6px;
      min-width: 160px;
      text-align: right;
      text-transform: uppercase;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(150px, 220px) minmax(150px, 220px) max-content;
      gap: 0;
      align-items: center;
    }

    label {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding-right: 12px;
      border-right: 1px solid var(--line);
      text-transform: uppercase;
    }

    label:last-of-type {
      border-right: 0;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input[type="search"] {
      width: 100%;
      height: 36px;
      border: 0;
      padding: 0 8px;
    }

    select {
      max-width: 100%;
    }

    button {
      min-height: 44px;
      border: 0;
      border-left: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:hover,
    .archive-row:hover {
      background: var(--mark);
    }

    .status {
      padding: 12px 0;
      border-bottom: 1px solid var(--soft-line);
    }

    .list-head,
    .archive-row {
      display: grid;
      grid-template-columns: 56px minmax(220px, 2fr) minmax(140px, 1fr) 120px 130px minmax(220px, 1.2fr);
      gap: 12px;
      align-items: center;
    }

    .list-head {
      min-height: 34px;
      text-transform: uppercase;
    }

    .archive-row {
      min-height: 54px;
      padding: 8px 0;
      border-color: var(--soft-line);
    }

    .work {
      overflow-wrap: anywhere;
      text-transform: uppercase;
    }

    .kind {
      color: var(--muted);
      text-transform: uppercase;
    }

    .state {
      text-transform: uppercase;
    }

    .state.warn {
      background: var(--mark);
      padding: 2px 6px;
      justify-self: start;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions a {
      border: 1px solid var(--line);
      padding: 5px 10px;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .actions a:hover {
      background: var(--text);
      color: var(--bg);
    }

    .actions .none {
      color: var(--muted);
      padding: 5px 0;
    }

    .empty {
      margin: 0;
      padding: 28px 0;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .masthead,
      .toolbar,
      .list-head,
      .archive-row {
        grid-template-columns: 1fr;
      }

      .summary {
        text-align: left;
      }

      label {
        border-right: 0;
        border-bottom: 1px solid var(--soft-line);
        padding-right: 0;
      }

      button {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .list-head {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Archive">
      <span>archivve list</span>
      <a id="sheet-link" href="#" target="_blank" rel="noopener">manifest sheet</a>
    </nav>

    <header class="masthead">
      <div>
        <h1>Class Web Archive</h1>
        <p class="subtitle">이 화면 하나에서 공개 목록과 관리 현황을 전환합니다. Archive 버튼을 누르면 viewer.html에서 보존본이 재생됩니다.</p>
      </div>
      <div class="summary" aria-live="polite">
        <span id="item-count">0 shown</span>
        <span id="semester-count">0 public</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Archive controls">
      <label>
        <span>Search:</span>
        <input id="search" type="search" autocomplete="off">
      </label>
      <label>
        <span>Semester:</span>
        <select id="semester">
          <option value="">All</option>
        </select>
      </label>
      <label>
        <span>Mode:</span>
        <select id="mode">
          <option value="public">Public list</option>
          <option value="all">All rows</option>
        </select>
      </label>
      <button id="reload" type="button">Reload</button>
    </section>

    <p class="status" id="status">manifest.csv를 읽는 중입니다.</p>

    <section aria-label="Archived works">
      <div class="list-head" aria-hidden="true">
        <span>No.</span>
        <span>Work</span>
        <span>Student</span>
        <span>Semester</span>
        <span>Status</span>
        <span>Links</span>
      </div>
      <div id="archive-list"></div>
      <p class="empty" id="empty-state" hidden>표시할 항목이 없습니다.</p>
    </section>
  </main>

  <script>
    // ── 설정 ──────────────────────────────────────────────────────────
    // 이 페이지는 같은 폴더의 로컬 manifest.csv만 읽어 목록을 만듭니다. 외부 의존 0.
    // 명단 편집은 구글 시트에서 하고, 캡처 때 manifest.csv로 내려받습니다.
    // 재생(viewer.html)은 서비스워커를 쓰므로 `python3 archive.py view`로 로컬 서버를 띄워 열어야 합니다.
    const VIEWER_URL = "viewer.html";
    // 상단 "manifest sheet" 링크가 가리키는 편집용 구글 시트.
    const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ttG_2q0ZKYopjJmkPUF9S3d3azgE8ymeFPboMheGVig/edit";
    // ──────────────────────────────────────────────────────────────────

    const state = {
      rows: [],
      query: "",
      semester: "",
      mode: new URLSearchParams(location.search).get("mode") === "all" ? "all" : "public",
    };

    const list = document.getElementById("archive-list");
    const empty = document.getElementById("empty-state");
    const search = document.getElementById("search");
    const semester = document.getElementById("semester");
    const mode = document.getElementById("mode");
    const reload = document.getElementById("reload");
    const statusLine = document.getElementById("status");
    const itemCount = document.getElementById("item-count");
    const semesterCount = document.getElementById("semester-count");

    document.getElementById("sheet-link").href = SHEET_EDIT_URL;
    mode.value = state.mode;

    function clean(value) {
      return String(value || "").trim();
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (quoted) {
          if (char === '"' && next === '"') {
            cell += '"';
            i += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(cell);
          cell = "";
        } else if (char === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (char !== "\r") {
          cell += char;
        }
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      const headers = (rows.shift() || []).map(clean);
      return rows
        .filter((values) => values.some(clean))
        .map((values) => {
          const item = {};
          headers.forEach((header, index) => {
            item[header] = clean(values[index]);
          });
          return item;
        });
    }

    function isPublic(row) {
      const status = clean(row.status).toLowerCase();
      return status === "ok" || status === "partial";
    }

    function isVisible(row) {
      return state.mode === "all" || isPublic(row);
    }

    function needsCapture(row) {
      const status = clean(row.status).toLowerCase();
      return status === "" || status === "pending" || status === "recapture-needed";
    }

    function slugify(value) {
      let out = "";
      for (const char of String(value).toLowerCase()) {
        if (/\p{L}|\p{N}/u.test(char)) {
          out += char;
        } else if (" -_.".includes(char)) {
          out += "-";
        }
      }
      return out.split("-").filter(Boolean).join("-") || "untitled";
    }

    // 크롤러(tools/crawl_manifest.py)와 같은 규칙으로 wacz 파일명을 정한다.
    function waczFile(row) {
      const file = clean(row.wacz_file);
      if (file) return file;
      const base = clean(row.student_name) || clean(row.title);
      const term = clean(row.semester) || "undated";
      return `${slugify(base)}-${slugify(term)}.wacz`;
    }

    // 재생 소스는 항상 로컬 상대경로 wacz/<semester>/<file> 로 계산한다.
    // 캡처가 안 된 행(대기)은 실제 파일이 없으므로 재생 버튼을 만들지 않는다.
    function archiveUrl(row) {
      const status = clean(row.status).toLowerCase();
      if (!clean(row.wacz_file)) return "";
      if (state.mode !== "all" && !["ok", "partial"].includes(status)) return "";
      const source = `wacz/${clean(row.semester)}/${waczFile(row)}`;
      const params = new URLSearchParams({
        title: clean(row.title) || clean(row.original_url),
        student: clean(row.student_name),
        url: clean(row.original_url),
        source,
      });
      return `${VIEWER_URL}?${params.toString()}`;
    }

    function matches(row) {
      const q = state.query.toLowerCase();
      const haystack = [
        row.title,
        row.student_name,
        row.type,
        row.semester,
        row.original_url,
        row.notes,
      ].map(clean).join(" ").toLowerCase();

      return isVisible(row) &&
        (!state.semester || clean(row.semester) === state.semester) &&
        (!q || haystack.includes(q));
    }

    function renderSummary() {
      const rows = state.rows.filter(isVisible);
      const publicRows = state.rows.filter(isPublic);
      const needCapture = state.rows.filter(needsCapture);
      itemCount.textContent = `${rows.length} shown`;
      semesterCount.textContent = `${publicRows.length} public / ${needCapture.length} need capture`;
    }

    function renderSemesterOptions() {
      const current = semester.value;
      semester.innerHTML = '<option value="">All</option>';
      const values = Array.from(
        new Set(state.rows.map((row) => clean(row.semester)).filter(Boolean))
      ).sort().reverse();

      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        semester.appendChild(option);
      }

      semester.value = values.includes(current) ? current : "";
      state.semester = semester.value;
    }

    function actionLink(label, href) {
      const link = document.createElement("a");
      link.textContent = label;
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      return link;
    }

    function renderRows() {
      list.innerHTML = "";
      const rows = state.rows.filter(matches);
      empty.hidden = rows.length > 0;

      rows.forEach((row, index) => {
        const item = document.createElement("div");
        item.className = "archive-row";

        const number = document.createElement("span");
        number.textContent = String(index + 1).padStart(2, "0");

        const work = document.createElement("span");
        work.className = "work";
        work.textContent = clean(row.title) || "Untitled";
        const kind = clean(row.type).toLowerCase();
        if (kind && kind !== "work") {
          const badge = document.createElement("span");
          badge.className = "kind";
          badge.textContent = ` · ${kind}`;
          work.appendChild(badge);
        }

        const student = document.createElement("span");
        student.textContent = clean(row.student_name) || "-";

        const term = document.createElement("span");
        term.textContent = clean(row.semester) || "-";

        const rowState = clean(row.status).toLowerCase() || "pending";
        const stateCell = document.createElement("span");
        stateCell.className = "state";
        stateCell.textContent = rowState;
        if (!["ok", "partial"].includes(rowState)) stateCell.classList.add("warn");

        const actions = document.createElement("span");
        actions.className = "actions";
        const replay = archiveUrl(row);
        if (replay) actions.appendChild(actionLink("Archive", replay));
        if (clean(row.original_url)) actions.appendChild(actionLink("Original", clean(row.original_url)));
        if (clean(row.drive_link)) actions.appendChild(actionLink("Drive", clean(row.drive_link)));
        if (!actions.childElementCount) {
          const none = document.createElement("span");
          none.className = "none";
          none.textContent = clean(row.status) || "pending";
          actions.appendChild(none);
        }

        item.append(number, work, student, term, stateCell, actions);
        list.appendChild(item);
      });
    }

    function setRows(rows, sourceLabel) {
      state.rows = rows;
      renderSummary();
      renderSemesterOptions();
      renderRows();
      statusLine.textContent = `${sourceLabel}에서 ${rows.length}개 항목을 읽었습니다.`;
    }

    // 같은 폴더의 로컬 manifest.csv만 읽는다. (localhost로 서빙되면 fetch가 동작한다)
    function loadManifest() {
      statusLine.textContent = "manifest.csv를 읽는 중입니다.";
      fetch("manifest.csv", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("manifest.csv");
          return response.text();
        })
        .then((text) => setRows(parseCsv(text), "manifest.csv"))
        .catch(() => {
          setRows([], "manifest.csv");
          statusLine.textContent = "manifest.csv를 읽지 못했습니다. index.html을 직접 열지 말고 `python3 archive.py view`로 실행해 주세요.";
        });
    }

    search.addEventListener("input", (event) => {
      state.query = event.target.value;
      renderRows();
    });

    semester.addEventListener("change", (event) => {
      state.semester = event.target.value;
      renderRows();
    });

    mode.addEventListener("change", (event) => {
      state.mode = event.target.value;
      const next = new URL(location.href);
      if (state.mode === "all") next.searchParams.set("mode", "all");
      else next.searchParams.delete("mode");
      history.replaceState(null, "", next);
      renderSummary();
      renderRows();
    });

    reload.addEventListener("click", loadManifest);

    loadManifest();
  </script>
</body>
</html>
